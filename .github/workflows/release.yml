name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Binaries
        run: |
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/piman main.go
          tar -czf dist/piman-linux-amd64.tar.gz -C dist piman
          
          # Linux ARM64 (Pi 4/5 64-bit)
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/piman main.go
          tar -czf dist/piman-linux-arm64.tar.gz -C dist piman
          
          # Linux ARMv7 (Pi 3/4 32-bit)
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/piman main.go
          tar -czf dist/piman-linux-armv7.tar.gz -C dist piman

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/piman-linux-amd64.tar.gz
            dist/piman-linux-arm64.tar.gz
            dist/piman-linux-armv7.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
